# Local development stack: Postgres + the API.
#   docker compose up --build
#   docker compose run --rm seed     # create the starter categories
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: readly
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d readly"]
      interval: 2s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/readly?sslmode=disable
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }

  seed:
    build: .
    entrypoint: ["/usr/local/bin/seed"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/readly?sslmode=disable
    depends_on:
      db: { condition: service_healthy }
    profiles: [tools]

volumes:
  pgdata:
